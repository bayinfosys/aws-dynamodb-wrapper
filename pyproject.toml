[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "dynawrap"
dynamic = ["version"]
description = "Unifed access pattern based interface for dynamodb, postgres and json"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Edward Grundy", email = "ed@bayis.co.uk" }
]
requires-python = ">=3.10"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
]
dependencies = [
    "pydantic>=2.0",
    "parse",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary"]
dynamodb = ["boto3"]
dev = [
    "pyscopg2-binary",
    "twine",
    "setuptools-scm>=8",
    "black",
    "flake8",
    "isort",
    "pytest",
]

[project.urls]
Owner = "https://www.bayis.co.uk"
Source = "https://github.com/bayinfosys/aws-dynamodb-wrapper"
PyPI = "https://pypi.org/project/dynawrap"

[tool.setuptools]
include-package-data = true

[tool.setuptools_scm]
